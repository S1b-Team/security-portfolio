# Sample detection — lab / portfolio use only
title: SSRF attempt toward link-local cloud metadata
id: lab-det-002-ssrf-metadata
status: experimental
description: >
  Detects webhook/callback requests targeting 169.254.169.254 or known metadata
  hostnames. Maps to credential access via instance metadata in cloud environments.
  In this lab the target is a FAKE mock returning labeled fake credentials.
references:
  - ATT&CK T1552.005 (Unsecured Credentials: Cloud Instance Metadata API)
  - ATT&CK T1090 (Proxy — as SSRF egress pattern)
logsource:
  category: application
  product: backoffice
detection:
  selection:
    event: webhook_ssrf_blocked
    url|contains:
      - '169.254.169.254'
      - 'metadata.google.internal'
      - '/latest/meta-data'
  selection_egress:
    dst_ip: 169.254.169.254
    outbound: true
  condition: selection or selection_egress
falsepositives:
  - None expected outside controlled lab demos
level: critical
tags:
  - attack.credential_access
  - attack.t1552.005
  - lab.defensive
